<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Fondo circular blanco con borde azul -->
    <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#0072ce" stroke-width="4"/>
    
    <!-- Engranaje Rojo Sodimac -->
    <g fill="#EB0029" transform="translate(32,32)">
        <rect x="14" y="-4" width="6" height="8" transform="rotate(0)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(45)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(90)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(135)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(180)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(225)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(270)"/>
        <rect x="14" y="-4" width="6" height="8" transform="rotate(315)"/>
        <circle cx="0" cy="0" r="12"/>
    </g>
    
    <!-- Casco Amarillo -->
    <path d="M 22 32 A 10 10 0 0 1 42 32" fill="#FFD700" stroke="#333" stroke-width="2"/>
    <rect x="18" y="32" width="28" height="4" fill="#FFD700" stroke="#333" stroke-width="2"/>
    
    <!-- Calculadora Azul -->
    <rect x="26" y="20" width="12" height="14" fill="#0072ce"/>
    <rect x="28" y="22" width="8" height="4" fill="#e0e0e0"/>
    <rect x="28" y="28" width="2" height="2" fill="#ffffff"/>
    <rect x="31" y="28" width="2" height="2" fill="#ffffff"/>
    <rect x="34" y="28" width="2" height="2" fill="#ffffff"/>
</svg>